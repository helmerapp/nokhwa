[package]
name = "nokhwa-core"
version = "0.1.7"
authors = ["l1npengtul <l1npengtul@protonmail.com>"]
edition = "2021"
description = "Core type definitions for nokhwa"
keywords = ["camera", "webcam", "capture", "cross-platform"]
license = "Apache-2.0"
repository = "https://github.com/l1npengtul/nokhwa"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["mjpeg"]
serialize = ["serde"]
wgpu-types = ["wgpu"]
mjpeg = ["mozjpeg"]
opencv-mat = ["opencv", "opencv/clang-runtime", "bytemuck"]
docs-features = ["serialize", "wgpu-types", "mjpeg"]
test-fail-warnings = []

[target.'cfg(target_os="windows")'.dependencies.windows]
version = "0.43"
features = ["Win32_Media_MediaFoundation"]

[dependencies]
thiserror = "2.0"
bytes = "1.3"

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.11.3", default-features = false, features = [
	"private",
	"blocks",
	"async",
	"av",
	"ca",
	"cm",
	"dispatch",
	"macos_13_0",
] }

[dependencies.image]
version = "0.25"
default-features = false

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[dependencies.wgpu]
version = "23"
optional = true

[dependencies.opencv]
version = "0.95"
optional = true

[dependencies.bytemuck]
version = "1"
optional = true

[dependencies.mozjpeg]
version = "0.10"
optional = true

[package.metadata.docs.rs]
features = ["docs-features"]
